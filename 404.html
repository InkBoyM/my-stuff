<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; font-size: 14px; background: #fff; color: #111; padding: 32px; max-width: 680px; }
  h1 { font-size: 1.1em; font-weight: bold; margin-bottom: 6px; }
  p { line-height: 1.6; margin-bottom: 12px; color: #333; }
  a { color: #111; }
  a:hover { text-decoration: underline; }
  .btn { display: inline-block; border: 1px solid #111; padding: 4px 10px; text-decoration: none; font-size: 0.9em; color: #111; }
  .btn:hover { background: #111; color: #fff; text-decoration: none; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found.</p>
  <a class="btn" href="/">← go home</a>
</body>
</html>
