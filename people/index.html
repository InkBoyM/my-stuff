<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; font-size: 14px; background: #fff; color: #111; padding: 32px; max-width: 680px; }
  h1 { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; }
  .back { display: block; margin-bottom: 24px; color: #111; text-decoration: none; font-size: 0.9em; }
  .back:hover { text-decoration: underline; }
  .person { border-top: 1px solid #ccc; padding: 16px 0; }
  .person:last-child { border-bottom: 1px solid #ccc; }
  .person-name { font-weight: bold; margin-bottom: 4px; }
  .person-role { color: #555; font-size: 0.92em; margin-bottom: 6px; }
  .person-links { font-size: 0.9em; }
  .person-links a { margin-right: 12px; text-decoration: none; color: #111; }
  .person-links a:hover { text-decoration: underline; }
  a { color: #111; }
</style>

<style id="dm-style">
  html.dark body { background: #111; color: #eee; }
  html.dark a { color: #eee; }
  html.dark .back { color: #eee; }
  html.dark .person { border-top-color: #444; }
  html.dark .person:last-child { border-bottom-color: #444; }
  html.dark .person-role { color: #aaa; }
  html.dark .person-links a { color: #eee; }
  #dm-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    background: none;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 5px 7px;
    cursor: pointer;
    color: inherit;
    line-height: 0;
    opacity: 0.7;
    z-index: 9999;
    transition: opacity 0.15s;
  }
  #dm-toggle:hover { opacity: 1; }
</style>
</head>
<body>
  <a class="back" href="../">← back</a>
  <h1>People</h1>

  <div class="person">
    <div class="person-name">Ryan Kim</div>
    <div class="person-role">Owner of <a href="https://labs.ko6lvm.org">LVM Labs</a></div>
  </div>

  <div class="person">
    <div class="person-name">Paul Fauve</div>
    <div class="person-role">Staff of <a href="https://killsecurly.com">KSF</a></div>
  </div>
  </div>

<button id="dm-toggle" aria-label="Toggle dark mode">
  <svg id="dm-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
  <svg id="dm-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
</button>
<script>
  (function() {
    var html = document.documentElement;
    var moon = document.getElementById('dm-moon');
    var sun = document.getElementById('dm-sun');
    function applyTheme(dark) {
      if (dark) {
        html.classList.add('dark');
        moon.style.display = 'none';
        sun.style.display = '';
      } else {
        html.classList.remove('dark');
        moon.style.display = '';
        sun.style.display = 'none';
      }
    }
    var saved = localStorage.getItem('theme');
    applyTheme(saved === 'dark');
    document.getElementById('dm-toggle').addEventListener('click', function() {
      var isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      applyTheme(!isDark);
    });
  })();
</script>
</body>
</html>
