<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordis Chat</title>
<meta name="description" content="Cordis Chat (not affiliated with Cordis Medical): an invite-only, closed-source frontend web communications application developed at LVM Labs.">
<meta name="author" content="Yehonathan Twig">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://inkboym.org/projects/cordis/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://inkboym.org/projects/cordis/">
<meta property="og:title" content="Cordis Chat">
<meta property="og:description" content="Cordis Chat (not affiliated with Cordis Medical): an invite-only, closed-source frontend web communications application developed at LVM Labs.">
<meta property="og:site_name" content="InkBoyM">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; font-size: 14px; background: #fff; color: #111; padding: 32px; max-width: 680px; opacity: 0; animation: fadein 0.18s ease forwards; }
  @keyframes fadein { to { opacity: 1; } }
  h1 { font-size: 1.1em; font-weight: bold; margin-bottom: 6px; }
  .back { display: block; margin-bottom: 24px; color: #111; text-decoration: none; font-size: 0.9em; }
  .back:hover { text-decoration: underline; }
  .meta { color: #444; margin-bottom: 4px; }
  .reg { margin-bottom: 16px; }
  .status-box { border-left: 3px solid #111; padding-left: 10px; margin-bottom: 14px; }
  p { line-height: 1.6; margin-bottom: 10px; }
  a { color: #111; }
  a:hover { text-decoration: underline; }
  .btn { display: inline-block; border: 1px solid #111; padding: 4px 10px; text-decoration: none; font-size: 0.9em; }
  .btn:hover { background: #111; color: #fff; text-decoration: none; }
</style>

<style id="dm-style">
  html.dark body { background: #111; color: #eee; }
  html.dark a { color: #eee; }
  html.dark .back { color: #eee; }
  html.dark .meta { color: #aaa; }
  html.dark .status-box { border-left-color: #eee; }
  html.dark .btn { border-color: #eee; color: #eee; }
  html.dark .btn:hover { background: #eee; color: #111; }
  #dm-toggle {
    position: fixed; top: 18px; right: 18px;
    background: none; border: 1px solid currentColor; border-radius: 4px;
    padding: 5px 7px; cursor: pointer; color: inherit;
    line-height: 0; opacity: 0.7; z-index: 9999; transition: opacity 0.15s;
  }
  #dm-toggle:hover { opacity: 1; }
</style>
</head>
<body>
  <a class="back" href="../">← back</a>
  <h1>Cordis</h1>
  <p class="meta">Frontend-dependent web communications application.</p>
  <p class="meta">LVMLabs Confidential, Private Access, Software</p>
  <p class="reg"><a href="https://labs.ko6lvm.org/software/cordis/regulations">Regulations →</a></p>

  <div class="status-box">
    <p>Cordis is currently down due to legal complications.</p>
    <p><a class="btn" href="status/">Learn more →</a></p>
  </div>

  <p>Cordis is an invite-only closed source application.</p>

<button id="dm-toggle" aria-label="Toggle dark mode">
  <svg id="dm-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
  <svg id="dm-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
</button>
<script>
  (function() {
    var html = document.documentElement, moon = document.getElementById('dm-moon'), sun = document.getElementById('dm-sun');
    function applyTheme(dark) { html.classList.toggle('dark', dark); moon.style.display = dark ? 'none' : ''; sun.style.display = dark ? '' : 'none'; }
    applyTheme(localStorage.getItem('theme') === 'dark');
    document.getElementById('dm-toggle').addEventListener('click', function() { var d = html.classList.contains('dark'); localStorage.setItem('theme', d ? 'light' : 'dark'); applyTheme(!d); });
  })();
</script>
</body>
</html>
